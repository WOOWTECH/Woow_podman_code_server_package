name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: woow-code-server
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared-file hashes (source of truth for HA/k3s repos)
        # rootfs/opt/SHA256SUMS records absolute in-image paths (checked
        # again inside the Containerfile build itself, where those paths
        # are real). Here, before the image build, we check the same
        # hashes against the source files in rootfs/ on the runner, so a
        # PR that edits pi-code/pi.sh/pi-seed without updating the
        # published SHA256SUMS fails fast — this file is what the HA and
        # k3s repos vendor to assert they carry byte-identical copies.
        run: |
          set -e
          while read -r hash path; do
            [ -n "${hash}" ] || continue
            actual="$(sha256sum "rootfs${path}" | cut -d' ' -f1)"
            if [ "${actual}" != "${hash}" ]; then
              echo "MISMATCH: rootfs${path} expected ${hash} got ${actual}" >&2
              exit 1
            fi
            echo "OK: rootfs${path}"
          done < rootfs/opt/SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}-${{ matrix.arch }}"
          TAGS="${BASE}:main-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${BASE}:${{ github.event.release.tag_name }},${BASE}:latest"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${BASE}:main"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Build (+ push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ github.event.release.tag_name || github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Publish SHA256SUMS as a release asset
        if: github.event_name == 'release' && matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" rootfs/opt/SHA256SUMS --clobber
