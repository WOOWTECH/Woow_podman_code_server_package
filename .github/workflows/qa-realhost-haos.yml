# QA-only real HA OS + Supervisor acceptance for the HA add-on R4 candidate (code-server).
# Lives only on the qa/realhost-20261127 branch; never merged. Runs nothing on main or on PRs.
# HAOS OVA boots under QEMU/KVM on the runner; Supervisor installs/updates/restores the add-on itself.
# Public log: stage names, PASS/FAIL, stable codes, hashes and versions only.
name: qa-realhost-haos
on:
  push:
    branches: ['qa/realhost-20261127']
    paths:
      - qa/realhost/haos_gate.py
      - qa/realhost/qga.py
      - qa/realhost/suite.py
      - qa/realhost/common.py
      - .github/workflows/qa-realhost-haos.yml
permissions:
  contents: read
concurrency:
  group: qa-realhost-haos
  cancel-in-progress: false
jobs:
  haos:
    name: haos supervisor (ubuntu-24.04, KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      QA_OUT: ${{ github.workspace }}/qa-out
      HA_REPO: ${{ github.workspace }}/ha-addon
    steps:
      - uses: actions/checkout@v4
      - name: HA add-on repository (released tag and candidate commit)
        run: |
          git clone --quiet --filter=blob:none https://github.com/WOOWTECH/Woow_ha_code_server_add_on.git "$HA_REPO"
          git -C "$HA_REPO" fetch --quiet origin feat/code-server-agent-connect-20261126 --tags
          git -C "$HA_REPO" cat-file -e 314a7126a588ffb3f7f859aa038df4f7a5cb9303^{commit}
          git -C "$HA_REPO" rev-parse v0.1.16^{commit}
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf xz-utils >/dev/null
          ls -l /dev/kvm
      - name: Browser for the three Web clients and HA
        run: |
          python3 -m venv "$HOME/qa-venv"
          "$HOME/qa-venv/bin/pip" install -q playwright==1.62.0 websockets==15.0.1
          "$HOME/qa-venv/bin/python" -m playwright install --with-deps chromium >/dev/null
      - name: Real HA OS + Supervisor gate
        run: '"$HOME/qa-venv/bin/python" qa/realhost/haos_gate.py'
      - name: Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haos-supervisor-amd64
          path: qa-out/*.json
          if-no-files-found: warn
      - name: Stop the VM
        if: always()
        run: '[ -f "$RUNNER_TEMP/haos/qemu.pid" ] && kill "$(cat "$RUNNER_TEMP/haos/qemu.pid")" || true'
