# QA-only real-host acceptance for the Agent Connect R4 candidate (code-server).
# Lives only on the qa/realhost-20261127 branch; never merged. Runs nothing on main or on PRs.
# Public log: stage names, PASS/FAIL, stable codes, hashes and versions only (see qa/realhost/suite.py).
name: qa-realhost
on:
  push:
    branches: ['qa/realhost-20261127']
permissions:
  contents: read
concurrency:
  group: qa-realhost
  cancel-in-progress: false
jobs:
  podman:
    name: podman ${{ matrix.mode }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [upgrade, fresh-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    env:
      MODE: ${{ matrix.mode }}
      QA_OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rootless podman 4.9.3 with a lingering systemd user manager
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns passt >/dev/null
          sudo loginctl enable-linger "$(id -un)"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          podman --version
      - name: Browser for the three Web clients
        run: |
          python3 -m venv "$HOME/qa-venv"
          "$HOME/qa-venv/bin/pip" install -q playwright==1.62.0
          "$HOME/qa-venv/bin/python" -m playwright install --with-deps chromium >/dev/null
      - name: Native Podman gate
        run: '"$HOME/qa-venv/bin/python" qa/realhost/podman_gate.py'
      - name: Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-${{ matrix.mode }}-${{ runner.arch }}
          path: qa-out/*.json
          if-no-files-found: warn
